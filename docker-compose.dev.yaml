services:
  server:
    build: .
    restart: on-failure
    environment:
      TZ: ${TZ:-Etc/UTC}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:${LEDGERFORGE_API_PORT:-5001}:5001"
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - type: bind
        source: ./ledgerforge.json
        target: /ledgerforge.json
        read_only: true
        bind:
          create_host_path: false

  worker:
    build: .
    restart: on-failure
    entrypoint: ["ledgerforge", "workers"]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:5004:5004"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - type: bind
        source: ./ledgerforge.json
        target: /ledgerforge.json
        read_only: true
        bind:
          create_host_path: false

  migration:
    build: .
    entrypoint: ["ledgerforge", "migrate", "up"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./ledgerforge.json
        target: /ledgerforge.json
        read_only: true
        bind:
          create_host_path: false

  redis:
    image: redis:7.2.4

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: on-failure
    ports:
      - "127.0.0.1:${POSTGRES_OUTER_PORT:-55432}:5432"
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerforge}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:29.0
    command:
      ["--data-dir", "/data", "--api-key=ledgerforge-api-key", "--listen-port", "8108"]
    environment:
      TYPESENSE_MEMORY_USED_MAX_PERCENTAGE: "${TYPESENSE_MEMORY_USED_MAX_PERCENTAGE:-85}"
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    logging:
      driver: "none"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8108/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - server
      - worker

volumes:
  pg_data:
  typesense_data:
