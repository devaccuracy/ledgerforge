# Local integration runner. Does not connect to services on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledgerforge
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ledgerforge"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.4
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  typesense:
    image: typesense/typesense:29.0
    network_mode: service:postgres
    command: ["--data-dir", "/tmp", "--api-key=ledgerforge-api-key", "--listen-port", "8108"]
    depends_on:
      postgres:
        condition: service_healthy
  test:
    image: ${GO_TEST_IMAGE:-golang:1.26.9}
    network_mode: service:postgres
    working_dir: /src
    volumes:
      - .:/src
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      LEDGERFORGE_DATA_SOURCE_DNS: postgres://postgres:password@localhost:5432/ledgerforge?sslmode=disable
      LEDGERFORGE_REDIS_DNS: localhost:6379
      LEDGERFORGE_TYPESENSE_DNS: http://localhost:8108
      GOTOOLCHAIN: local
    entrypoint: ["bash", ".github/scripts/test-integration.sh"]
    depends_on:
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
volumes:
  go_modules:
  go_build:
