name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/go.yml

  binaries:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build both CLIs and archive license notices
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          directory="ledgerforge_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "$directory" dist
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -trimpath -o "$directory/ledgerforge$suffix" ./cmd/ledgerforge
          go build -trimpath -o "$directory/ledgerforge-mcp$suffix" ./cmd/ledgerforge-mcp
          cp LICENSE.md NOTICE.md "$directory/"
          if [ "$GOOS" = windows ]; then
            zip -r "dist/$directory.zip" "$directory"
          else
            tar -czf "dist/$directory.tar.gz" "$directory"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  container:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/devaccuracy/ledgerforge
          # main owns latest; a prerelease tag must never move that alias.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Source and dependency SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/ledgerforge-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container SBOM for the published digest
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/devaccuracy/ledgerforge@${{ needs.container.outputs.digest }}
          format: spdx-json
          output-file: dist/ledgerforge-container.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'ghcr.io/devaccuracy/ledgerforge@%s\n' "$IMAGE_DIGEST" > dist/container-digest.txt
          (cd dist && sha256sum -- * > checksums.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            options=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${options[@]}"
          fi
