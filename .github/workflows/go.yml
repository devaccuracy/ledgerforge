name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Race-detector test suite
        run: go test -race -short ./...

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerforge
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      typesense:
        image: typesense/typesense:29.0
        env:
          TYPESENSE_API_KEY: ledgerforge-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true

      - name: Migrate Database
        run: go run ./cmd/ledgerforge migrate up
        env:
          LEDGERFORGE_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/ledgerforge?sslmode=disable
          LEDGERFORGE_REDIS_DNS: localhost:6379

      - name: Test
        run: go test -v -p 1 ./...
        env:
          LEDGERFORGE_TYPESENSE_DNS: http://localhost:8108

  race:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ledgerforge
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      typesense:
        image: typesense/typesense:29.0
        env:
          TYPESENSE_API_KEY: ledgerforge-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.0

      - name: Tidy
        run: go mod tidy

      - name: Migrate Database
        run: go run ./cmd/ledgerforge migrate up
        env:
          LEDGERFORGE_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/ledgerforge?sslmode=disable
          LEDGERFORGE_REDIS_DNS: localhost:6379

      - name: Test (race detector)
        run: go test -race -p 1 ./...
        env:
          LEDGERFORGE_TYPESENSE_DNS: http://localhost:8108
