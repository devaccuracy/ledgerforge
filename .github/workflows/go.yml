name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Release dependency and documentation contracts
        run: |
          python3 .github/scripts/test-readiness.py
          python3 -m unittest discover -s examples/webhook-verification -p 'test_*.py'

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Race-detector test suite
        run: go test -race -short ./...

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerforge
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      typesense:
        image: typesense/typesense:29.0
        env:
          TYPESENSE_API_KEY: ledgerforge-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Migrate Database
        run: go run ./cmd/ledgerforge migrate up
        env:
          LEDGERFORGE_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/ledgerforge?sslmode=disable
          LEDGERFORGE_REDIS_DNS: localhost:6379

      - name: Test
        run: go test -v -p 1 -coverprofile=coverage.out -covermode=atomic ./...
        env:
          LEDGERFORGE_TYPESENSE_DNS: http://localhost:8108

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  race:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerforge
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      typesense:
        image: typesense/typesense:29.0
        env:
          TYPESENSE_API_KEY: ledgerforge-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Tidy
        run: go mod tidy

      - name: Migrate Database
        run: go run ./cmd/ledgerforge migrate up
        env:
          LEDGERFORGE_DATA_SOURCE_DNS: postgres://postgres@localhost:5432/ledgerforge?sslmode=disable
          LEDGERFORGE_REDIS_DNS: localhost:6379

      - name: Test (race detector)
        run: go test -race -p 1 ./...
        env:
          LEDGERFORGE_TYPESENSE_DNS: http://localhost:8108

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
      - name: Check reachable vulnerabilities
        run: make vuln

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
      - name: Fuzz smoke (skip cleanly when no targets exist)
        run: .github/scripts/fuzz-smoke.sh
