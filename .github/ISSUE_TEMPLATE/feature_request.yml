name: Feature request
description: Propose a new capability or an improvement to LedgerForge.
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/devaccuracy/ledgerforge/blob/main/ROADMAP.md)
        and existing issues first. Concrete use cases help us prioritize.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, configuration or tooling you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ledger and transactions
        - Verification and audit
        - Agent guardrails and policies
        - MCP server
        - HTTP API or Go library
        - Operations, deployment or observability
        - Documentation or examples
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and accounting impact
      description: Would this change existing API, configuration, schema or monetary behavior?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this.
