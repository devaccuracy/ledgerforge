# LOCAL ONLY: development credentials, HTTP on loopback, disposable demo data.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledgerforge
    volumes:
      - demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ledgerforge"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  server:
    build:
      context: ../..
    image: ledgerforge-demo:local
    entrypoint: ["sh", "-c"]
    command: ["ledgerforge migrate up && ledgerforge start"]
    ports:
      - "127.0.0.1:${LEDGERFORGE_API_PORT:-5001}:5001"
    volumes:
      - type: bind
        source: ./ledgerforge.local.json
        target: /ledgerforge.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5001; printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  worker:
    image: ledgerforge-demo:local
    entrypoint: ["ledgerforge", "workers"]
    volumes:
      - type: bind
        source: ./ledgerforge.local.json
        target: /ledgerforge.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      server:
        condition: service_healthy
volumes:
  demo_data:
