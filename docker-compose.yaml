services:
  init:
    image: alpine:3.19
    container_name: init
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["/bin/sh", "/workspace/ledgerforge-init.sh"]
    restart: "no"

  server:
    image: ${LEDGERFORGE_IMAGE:-ghcr.io/devaccuracy/ledgerforge:main}
    container_name: server
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ledgerforge migrate up && ledgerforge start"
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "5001:5001"
    depends_on:
      - init
      - redis
      - postgres
    volumes:
      - ./ledgerforge.json:/ledgerforge.json

  worker:
    image: ${LEDGERFORGE_IMAGE:-ghcr.io/devaccuracy/ledgerforge:main}
    container_name: worker
    restart: on-failure
    entrypoint: ["ledgerforge", "workers"]
    ports:
      - "5004:5004"
    depends_on:
      - init
      - redis
      - postgres
    volumes:
      - ./ledgerforge.json:/ledgerforge.json

  redis:
    image: redis:7.2.4
    container_name: redis
    restart: on-failure

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ${POSTGRES_CONTAINER:-postgres}
    restart: on-failure
    ports:
      - "${POSTGRES_OUTER_PORT:-5432}:5432"
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerforge}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:29.0
    container_name: typesense
    profiles:
      - search
    command:
      ["--data-dir", "/data", "--api-key=ledgerforge-api-key", "--listen-port", "8108"]
    environment:
      TYPESENSE_MEMORY_USED_MAX_PERCENTAGE: "${TYPESENSE_MEMORY_USED_MAX_PERCENTAGE:-85}"
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    profiles:
      - tracing
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - server
      - worker

volumes:
  pg_data:
  typesense_data:
